<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Form</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }

      body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f2f2f2;
      }

      .login-container {
        width: 350px;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      }

      h2 {
        text-align: center;
        margin-bottom: 25px;
      }

      .input-group {
        margin-bottom: 15px;
      }

      label {
        display: block;
        margin-bottom: 5px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }

      #message {
        margin-top: 15px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="login-container">
      <h2>Login</h2>

      <form id="loginForm">
        <div class="input-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Enter your email" />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
          />
        </div>

        <button type="submit">Login</button>

        <p id="message"></p>
        <p>sdsdsdasd</p>
        <p>dfdfdfsdfdf</p>
        <p>dfdfdsfsdfsdfdsfsdff</p>
        <p>fdfsdsdsd</p>
        <p>hello</p>
        <p>dfdfdfsdf</p>
        <p>testing 1 update</p>
        <p>helloooooooo</p>

        <h1>helllo</h1>
        <h2>h2 hello</h2>

      </form>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (email === "" || password === "") {
          document.getElementById("message").textContent =
            "Please fill all fields";
          return;
        }

        if (email === "admin@gmail.com" && password === "123456") {
          document.getElementById("message").textContent = "Login successful!";
        } else {
          document.getElementById("message").textContent =
            "Invalid email or password";
        }
      });
    </script>
  </body>
</html>
